<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f11">
  <link rel="icon" type="image/svg+xml" href="assets/von-rosenberg.svg">
  <title>Rosenberg sources</title>
  <link rel="stylesheet" href="styles.css?v=123">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header class="site-header">
    <div class="site-brand" style="display:flex; flex-direction:row; align-items:center; gap:.75rem;">
      <img class="site-brand-shield" src="assets/von-rosenberg.svg" width="24" height="28" alt="Von Rosenberg coat of arms">
      <h1 style="margin:0; white-space:nowrap;">Rosenberg sources</h1>
        <a class="facebook-link" href="https://www.facebook.com/Eberhard.von.Rosenberg" target="_blank" rel="noopener noreferrer" aria-label="Eberhard von Rosenberg on Facebook" title="Eberhard von Rosenberg on Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.2 8.1h2.1V4.7c-.4-.1-1.7-.2-3.1-.2-3.1 0-5.2 1.9-5.2 5.4v3H4.6v3.8H8v7.6h4.1v-7.6h3.4l.5-3.8h-3.9V10.2c0-1.1.3-2.1 2.1-2.1Z" /></svg>
        </a>
        <a class="google-drive-link" href="https://drive.google.com/drive/folders/1UlaxJZkIQdvSOJnZxCTCMpCsrc_5SnfB?usp=drive_link" target="_blank" rel="noopener noreferrer" aria-label="Rosenberg Google Drive folder" title="Rosenberg Google Drive folder">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g transform="translate(0 3)">
              <path d="M7.71 3.5 1.15 14.86l3.42 5.93 6.56-11.36L7.71 3.5Z" />
              <path d="M16.29 3.5H9.44L16 14.86h6.85L16.29 3.5Z" />
              <path d="M4.57 20.79h13.14l3.43-5.93H8l-3.43 5.93Z" />
            </g>
          </svg>
        </a>
    </div>
    <div class="controls" aria-label="Display options">
      <button id="language-toggle" class="language-toggle" type="button" aria-label="English only" title="English only">文</button>
      <button id="facts-toggle" class="facts-toggle" type="button" aria-label="Hide facts" title="Hide facts" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 6 1.5 1.5L8 5M11 6h9M4 12l1.5 1.5L8 11M11 12h9M4 18l1.5 1.5L8 17M11 18h9" /></svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="true"></button>
      <button id="local-save-push" class="local-save-push" type="button" aria-label="Commit and push changes" title="Commit and push changes" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h12l4 4v14H3V3h2Z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/><path d="M9 16h6"/></svg>
      </button>
      <button id="local-refresh" class="local-refresh" type="button" aria-label="Restart local server and refresh" title="Restart local server and refresh" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4.8 9a7 7 0 0 1 12-2L20 12M4 17v-5h5m10.2 3a7 7 0 0 1-12 2L4 12" /></svg>
      </button>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Books, notes, seals, letters, map, images, and family tree">
      <div id="tabs"></div>
      <div id="book-tabs" class="subtabs" aria-label="Books or image collections"></div>
    </nav>
    <p id="status" class="status" role="status"></p>
    <section id="content" aria-live="polite"></section>
  </main>

  <dialog id="image-lightbox" class="image-lightbox" aria-label="Image viewer">
    <button id="image-lightbox-close" class="image-lightbox-close" type="button" aria-label="Close image viewer" title="Close"><span class="image-lightbox-close-icon" aria-hidden="true"></span></button>
    <div id="image-lightbox-editor" class="image-lightbox-editor" hidden>
      <span id="image-lightbox-collection-navigation" class="image-lightbox-collection-navigation" hidden aria-label="Collection cover images">
        <button id="image-lightbox-collection-previous" type="button" aria-label="Previous collection image">‹</button>
        <span id="image-lightbox-collection-position" aria-live="polite"></span>
        <button id="image-lightbox-collection-next" type="button" aria-label="Next collection image">›</button>
      </span>
      <button id="image-lightbox-add-region" type="button" aria-pressed="false" title="Draw and name an area on this image">Add named region</button>
      <button id="image-lightbox-remove-region" type="button" hidden>Remove selected region</button>
      <button id="image-lightbox-add-seal" type="button">Add seal</button>
      <button id="image-lightbox-remove-image" type="button">Remove image</button>
      <button id="image-lightbox-remove-seal" type="button" hidden>Remove selected</button>
      <span id="image-lightbox-seal-selected-controls" hidden>
        <label>Width <input id="image-lightbox-seal-width" type="range" min="0" max="1" step="0.01" value="0" disabled></label>
        <label>Widening rotation <input id="image-lightbox-seal-widening-rotation" type="range" min="-90" max="90" step="1" value="0" disabled></label>
        <label>Rotation <input id="image-lightbox-seal-rotation" type="range" min="-180" max="180" step="1" value="0" disabled></label>
        <fieldset class="image-lightbox-seal-type" aria-label="Seal type">
          <legend>Type</legend>
          <label><input name="image-lightbox-seal-type" value="contrepalle" type="radio" disabled> contrepalle</label>
          <label><input name="image-lightbox-seal-type" value="swans" type="radio" disabled> swans</label>
          <label><input name="image-lightbox-seal-type" value="helm" type="radio" disabled> helm</label>
          <label><input name="image-lightbox-seal-type" value="full" type="radio" disabled> full</label>
        </fieldset>
      </span>
      <span id="image-lightbox-save-status" class="image-lightbox-save-status" role="status" aria-live="polite"></span>
    </div>
    <div id="image-lightbox-stage" class="image-lightbox-stage">
      <img id="image-lightbox-image" alt="">
      <div id="image-lightbox-annotations" class="image-lightbox-annotations" aria-hidden="true"></div>
      <div id="image-lightbox-region-overlay" class="image-lightbox-region-overlay" aria-hidden="true"><div class="image-lightbox-region-box"></div></div>
    </div>
    <div id="image-lightbox-description" class="image-lightbox-description" hidden></div>
    <div id="image-lightbox-seal-preview" class="image-lightbox-seal-preview" hidden aria-live="polite">
      <input class="image-lightbox-seal-preview-name" type="text" aria-label="Seal name" hidden>
      <span class="seal-crop is-loading"><img alt=""></span>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js?v=122"></script>
</body>
</html>
