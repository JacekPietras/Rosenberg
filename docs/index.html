<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>von Rosenberg sources</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>von Rosenberg sources</h1>
    </div>
    <div class="controls" aria-label="Display options">
      <label><input type="radio" name="language" value="english" checked> English</label>
      <label><input type="radio" name="language" value="german"> German</label>
      <label><input type="radio" name="language" value="both"> Both</label>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Books and letters">
      <div id="tabs"></div>
    </nav>
    <p id="status" class="status" role="status">Loading…</p>
    <section id="content" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
