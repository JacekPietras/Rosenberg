<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f11">
  <link rel="icon" type="image/svg+xml" href="assets/von-rosenberg.svg">
  <title>Rosenberg sources</title>
  <link rel="stylesheet" href="styles.css?v=34">
</head>
<body>
  <header class="site-header">
    <div class="site-brand" style="display:flex; flex-direction:row; align-items:center; gap:.75rem;">
      <img class="site-brand-shield" src="assets/von-rosenberg.svg" width="24" height="28" alt="Von Rosenberg coat of arms">
      <h1 style="margin:0; white-space:nowrap;">Rosenberg sources</h1>
    </div>
    <div class="controls" aria-label="Display options">
      <button id="language-toggle" class="language-toggle" type="button" aria-label="English only" title="English only">文</button>
      <button id="facts-toggle" class="facts-toggle" type="button" aria-label="Hide facts" title="Hide facts" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 6 1.5 1.5L8 5M11 6h9M4 12l1.5 1.5L8 11M11 12h9M4 18l1.5 1.5L8 17M11 18h9" /></svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="true"></button>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Books, notes, seals, and letters">
      <div id="tabs"></div>
    </nav>
    <p id="status" class="status" role="status">Loading…</p>
    <section id="content" aria-live="polite"></section>
  </main>

  <dialog id="image-lightbox" class="image-lightbox" aria-label="Image viewer">
    <button id="image-lightbox-close" class="image-lightbox-close" type="button" aria-label="Close image viewer" title="Close"><span class="image-lightbox-close-icon" aria-hidden="true"></span></button>
    <div id="image-lightbox-editor" class="image-lightbox-editor" hidden>
      <button id="image-lightbox-add-seal" type="button">Add seal</button>
      <button id="image-lightbox-remove-image" type="button">Remove image</button>
      <button id="image-lightbox-remove-seal" type="button" hidden>Remove selected</button>
      <label>Width <input id="image-lightbox-seal-width" type="range" min="0" max="1" step="0.01" value="0" disabled></label>
      <label>Widening rotation <input id="image-lightbox-seal-widening-rotation" type="range" min="-180" max="180" step="1" value="0" disabled></label>
      <label>Rotation <input id="image-lightbox-seal-rotation" type="range" min="-180" max="180" step="1" value="0" disabled></label>
      <span id="image-lightbox-save-status" role="status"></span>
    </div>
    <div id="image-lightbox-stage" class="image-lightbox-stage">
      <img id="image-lightbox-image" alt="">
      <div id="image-lightbox-annotations" class="image-lightbox-annotations" aria-hidden="true"></div>
    </div>
    <div id="image-lightbox-seal-preview" class="image-lightbox-seal-preview" hidden aria-live="polite">
      <span class="seal-crop is-loading"><img alt=""></span>
      <input class="image-lightbox-seal-preview-name" type="text" aria-label="Seal name" hidden>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="app.js?v=35"></script>
</body>
</html>
